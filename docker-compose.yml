version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-devsecops-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ai_devsecops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ai_devsecops_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-ai_devsecops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_devsecops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - ai-devsecops-network

  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: ai-devsecops-backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ai_devsecops}:${POSTGRES_PASSWORD:-ai_devsecops_secure_password}@postgres:5432/${POSTGRES_DB:-ai_devsecops}
      - AI_ENABLED=false
      - AI_PROVIDER=openai
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_BASE_URL=${AI_API_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-gpt-3.5-turbo}
      - AI_REQUEST_TIMEOUT=30
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
      - MAX_FILE_SIZE=5242880
      - RATE_LIMIT_PER_MINUTE=60
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - ai-devsecops-network

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: ai-devsecops-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - ai-devsecops-network

volumes:
  postgres_data:

networks:
  ai-devsecops-network:
    driver: bridge
